<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password - SIMS | Smart Student Internship Management System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/company-module.css">
<style>
  .pwd-wrap { position: relative; }
  .pwd-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); font-size: 14px; }
  .pwd-strength { height: 4px; background: #e2e8f0; border-radius: 4px; margin-top: 8px; overflow: hidden; display: flex; gap: 2px; }
  .pwd-bar { flex: 1; background: transparent; transition: background .3s; }
  .str-weak .pwd-bar:nth-child(1) { background: #ef4444; }
  .str-medium .pwd-bar:nth-child(1), .str-medium .pwd-bar:nth-child(2) { background: #f59e0b; }
  .str-strong .pwd-bar { background: #16a34a; }
  .str-text { font-size: 11px; margin-top: 4px; text-align: right; color: var(--text-muted); }
</style>
</head>
<body class="dashboard-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="dashboard-shell">
  <aside class="dashboard-sidebar" id="dashboardSidebar"></aside>

  <div class="dashboard-main-col">
    <header class="dashboard-topbar">
      <div class="dashboard-topbar-left">
        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
        <div class="dashboard-page-title">Change Password<span>Keep your account secure</span></div>
      </div>
      <div class="dashboard-topbar-right">
        <button class="icon-btn dash-icon-btn" id="dashNotifBtn" aria-label="Notifications"><i class="fa-regular fa-bell"></i><span class="badge">2</span></button>
        <div class="dash-profile-trigger" id="dashProfileTrigger">
          <span class="dash-avatar-sm" id="dashAvatarSm" style="background:linear-gradient(135deg,#2563eb,#7c3aed);">TN</span>
          <span class="dash-name" id="dashNameTop">TechNova Pvt Ltd<span>Company</span></span>
          <i class="fa-solid fa-chevron-down" style="font-size:11px;color:#94a3b8;"></i>
        </div>
      </div>
    </header>

    <main class="dashboard-content">
      <div class="pm-breadcrumb" id="breadcrumbNav"></div>

      <div class="co-page-header">
        <div class="co-page-header-left">
          <h1>Change Password</h1>
          <p>Update your password regularly to maintain security</p>
        </div>
      </div>

      <div class="co-panel" style="max-width:500px;">
        <form id="pwdForm">
          
          <div class="co-form-group">
            <label>Current Password <span style="color:#ef4444">*</span></label>
            <div class="pwd-wrap">
              <input type="password" id="curPwd" required style="width:100%;padding:12px 40px 12px 14px;border:1px solid var(--border-light);border-radius:8px;font-family:inherit;font-size:13.5px;outline:none;">
              <i class="fa-regular fa-eye pwd-toggle" onclick="togglePwd('curPwd', this)"></i>
            </div>
          </div>

          <div class="co-form-group">
            <label>New Password <span style="color:#ef4444">*</span></label>
            <div class="pwd-wrap">
              <input type="password" id="newPwd" required style="width:100%;padding:12px 40px 12px 14px;border:1px solid var(--border-light);border-radius:8px;font-family:inherit;font-size:13.5px;outline:none;" oninput="checkStrength(this.value)">
              <i class="fa-regular fa-eye pwd-toggle" onclick="togglePwd('newPwd', this)"></i>
            </div>
            <div class="pwd-strength" id="strBar"><div class="pwd-bar"></div><div class="pwd-bar"></div><div class="pwd-bar"></div><div class="pwd-bar"></div></div>
            <div class="str-text" id="strText">Password Strength</div>
          </div>

          <div class="co-form-group">
            <label>Confirm Password <span style="color:#ef4444">*</span></label>
            <div class="pwd-wrap">
              <input type="password" id="confPwd" required style="width:100%;padding:12px 40px 12px 14px;border:1px solid var(--border-light);border-radius:8px;font-family:inherit;font-size:13.5px;outline:none;">
              <i class="fa-regular fa-eye pwd-toggle" onclick="togglePwd('confPwd', this)"></i>
            </div>
            <div id="pwdMatchError" style="color:#ef4444;font-size:12px;margin-top:6px;display:none;">Passwords do not match.</div>
          </div>

          <div style="display:flex;gap:12px;margin-top:24px;">
            <button type="submit" class="btn btn-primary" id="updateBtn">Update Password</button>
            <a href="company-settings.html" class="btn btn-ghost" style="text-decoration:none;">Cancel</a>
          </div>

        </form>
      </div>

    </main>
  </div>
</div>

<div class="modal-overlay" id="logoutModalOverlay">
  <div class="modal-box" style="max-width:380px;text-align:center;">
    <div class="modal-icon icon-red"><i class="fa-solid fa-right-from-bracket"></i></div>
    <h3 class="modal-title">Logout Confirmation</h3>
    <p class="modal-sub">Are you sure you want to logout from SIMS Company Dashboard?</p>
    <div style="display:flex;gap:12px;">
      <button type="button" class="btn btn-ghost" id="logoutNoBtn" style="flex:1;justify-content:center;">No, Stay</button>
      <button type="button" class="btn btn-primary" id="logoutYesBtn" style="flex:1;justify-content:center;">Yes, Logout</button>
    </div>
  </div>
</div>
<div class="login-toast" id="dashToast"><i class="fa-solid fa-circle-check"></i><span id="dashToastMsg">Done!</span></div>

<script src="../js/global-store.js"></script>
<script src="../js/company-dashboard.js"></script>
<script>
  function togglePwd(id, icon) {
    const input = document.getElementById(id);
    if(input.type === 'password') { input.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
    else { input.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
  }

  function checkStrength(val) {
    const bar = document.getElementById('strBar');
    const txt = document.getElementById('strText');
    bar.className = 'pwd-strength';
    if(val.length === 0) { txt.innerText = 'Password Strength'; return; }
    
    let strength = 0;
    if(val.length >= 8) strength++;
    if(/[A-Z]/.test(val)) strength++;
    if(/[0-9]/.test(val)) strength++;
    if(/[^A-Za-z0-9]/.test(val)) strength++;

    if(strength <= 1) { bar.classList.add('str-weak'); txt.innerText = 'Weak'; txt.style.color = '#ef4444'; }
    else if(strength === 2 || strength === 3) { bar.classList.add('str-medium'); txt.innerText = 'Medium'; txt.style.color = '#f59e0b'; }
    else { bar.classList.add('str-strong'); txt.innerText = 'Strong'; txt.style.color = '#16a34a'; }
  }

  document.getElementById('pwdForm').addEventListener('submit', e => {
    e.preventDefault();
    const newPwd = document.getElementById('newPwd').value;
    const confPwd = document.getElementById('confPwd').value;
    const err = document.getElementById('pwdMatchError');
    
    if(newPwd !== confPwd) {
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';
    
    const btn = document.getElementById('updateBtn');
    btn.disabled = true;
    btn.innerHTML = 'Updating...';
    
    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = 'Update Password';
      document.getElementById('pwdForm').reset();
      checkStrength('');
      if(window.simsShowToast) window.simsShowToast('Password updated successfully!', 'success');
    }, 1000);
  });
</script>
</body>
</html>
