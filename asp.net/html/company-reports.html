<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports Generation - SIMS | Smart Student Internship Management System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/company-module.css">
</head>
<body class="dashboard-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="dashboard-shell">
  <aside class="dashboard-sidebar" id="dashboardSidebar"></aside>

  <div class="dashboard-main-col">
    <header class="dashboard-topbar">
      <div class="dashboard-topbar-left">
        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
        <div class="dashboard-page-title">Reports Generation<span>Export recruitment and internship data</span></div>
      </div>
      <div class="dashboard-topbar-right">
        <button class="icon-btn dash-icon-btn" id="dashNotifBtn" aria-label="Notifications"><i class="fa-regular fa-bell"></i><span class="badge">2</span></button>
        <div class="dash-profile-trigger" id="dashProfileTrigger">
          <span class="dash-avatar-sm" id="dashAvatarSm" style="background:linear-gradient(135deg,#2563eb,#7c3aed);">TN</span>
          <span class="dash-name" id="dashNameTop">TechNova Pvt Ltd<span>Company</span></span>
          <i class="fa-solid fa-chevron-down" style="font-size:11px;color:#94a3b8;"></i>
        </div>
      </div>
    </header>

    <main class="dashboard-content">
      <div class="pm-breadcrumb" id="breadcrumbNav"></div>

      <div class="co-page-header">
        <div class="co-page-header-left">
          <h1>Generate Reports</h1>
          <p>Select report type, apply filters, and download as PDF or Excel</p>
        </div>
      </div>

      <div class="co-panel" style="max-width:800px;">
        <form id="reportForm">
          <h3 style="font-size:16px;font-weight:700;color:var(--text-dark);margin-bottom:20px;">Report Criteria</h3>

          <div class="co-form-group">
            <label>Report Type <span style="color:#ef4444">*</span></label>
            <select required style="width:100%;padding:12px;border:1px solid var(--border-light);border-radius:8px;font-family:inherit;font-size:13.5px;outline:none;">
              <option value="">Select Report Type...</option>
              <option>Internship Performance Report</option>
              <option>Applications Summary</option>
              <option>Interview & Hiring Results</option>
              <option>Hired Students List</option>
            </select>
          </div>

          <div class="co-form-grid-2">
            <div class="co-form-group">
              <label>Date Range (From)</label>
              <input type="date">
            </div>
            <div class="co-form-group">
              <label>Date Range (To)</label>
              <input type="date">
            </div>
          </div>

          <div class="co-form-group">
            <label>Filter by Internship</label>
            <select style="width:100%;padding:12px;border:1px solid var(--border-light);border-radius:8px;font-family:inherit;font-size:13.5px;outline:none;">
              <option value="">All Internships</option>
              <option>Frontend Developer Intern</option>
              <option>Data Analyst Intern</option>
              <option>UI/UX Design Intern</option>
            </select>
          </div>
          
          <div class="co-form-group">
            <label>Filter by Department</label>
            <select style="width:100%;padding:12px;border:1px solid var(--border-light);border-radius:8px;font-family:inherit;font-size:13.5px;outline:none;">
              <option value="">All Departments</option>
              <option>Engineering</option>
              <option>Design</option>
              <option>Data Science</option>
            </select>
          </div>

          <div style="display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;">
            <button type="submit" class="btn btn-primary" id="genPdfBtn" style="display:inline-flex;align-items:center;gap:8px;">
              <span class="btn-spinner" id="pdfSpinner" style="display:none;"></span>
              <i class="fa-solid fa-file-pdf"></i> Download PDF
            </button>
            <button type="button" class="btn btn-ghost" id="genExcelBtn" style="display:inline-flex;align-items:center;gap:8px;background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;">
              <i class="fa-solid fa-file-excel"></i> Download Excel
            </button>
            <button type="button" class="btn btn-ghost" style="display:inline-flex;align-items:center;gap:8px;" onclick="window.print()">
              <i class="fa-solid fa-print"></i> Print
            </button>
          </div>
        </form>
      </div>

    </main>
  </div>
</div>

<div class="login-toast" id="dashToast"><i class="fa-solid fa-circle-check"></i><span id="dashToastMsg">Done!</span></div>

<script src="../js/global-store.js"></script>
<script src="../js/company-dashboard.js"></script>
<script src="../js/company-reports.js"></script>
</body>
</html>
