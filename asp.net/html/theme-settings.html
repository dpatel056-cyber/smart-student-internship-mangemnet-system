<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme & Appearance - SIMS | Smart Student Internship Management System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/internship-module.css">
<link rel="stylesheet" href="../css/settings-module.css">
<style>
  a { text-decoration: none; }
  body { background-color: var(--body-bg); font-family: 'Poppins', sans-serif; transition: background-color 0.3s, color 0.3s; }
  p { margin-bottom: 0; }
  
  /* Live preview styles */
  .dark-preview-mode {
      --body-bg: #0f172a;
      --navy-900: #f8fafc;
      --text-muted: #94a3b8;
      --border-light: #334155;
  }
  .dark-preview-mode .st-form-card, 
  .dark-preview-mode .theme-card, 
  .dark-preview-mode .dashboard-topbar,
  .dark-preview-mode .dashboard-sidebar {
      background-color: #1e293b !important;
      border-color: #334155 !important;
      color: #f8fafc !important;
  }
</style>
</head>
<body class="dashboard-body" id="previewBody">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="dashboard-shell">

  <aside class="dashboard-sidebar" id="dashboardSidebar"></aside>

  <div class="dashboard-main-col">
    <header class="dashboard-topbar"></header>

    <main class="dashboard-content">

      <div class="pm-breadcrumb" style="margin-bottom: 24px;">
        <a href="student-dashboard.html">Dashboard</a><i class="fa-solid fa-chevron-right"></i>
        <a href="settings.html">Settings</a><i class="fa-solid fa-chevron-right"></i>
        <span class="current">Theme & Appearance</span>
      </div>

      <div class="st-form-card" style="max-width:800px;">
        <h4 style="font-size:18px;font-weight:600;color:var(--navy-900);margin-bottom:24px;">Theme Settings</h4>
        
        <div class="mb-4">
          <label class="form-label" style="display:block;margin-bottom:12px;">Mode Preference</label>
          <div class="theme-options">
            <div class="theme-card active" data-mode="light">
              <div class="theme-preview-box light"></div>
              <span style="font-weight:600;font-size:14px;color:var(--navy-900);">Light Mode</span>
            </div>
            <div class="theme-card" data-mode="dark">
              <div class="theme-preview-box dark"></div>
              <span style="font-weight:600;font-size:14px;color:var(--navy-900);">Dark Mode</span>
            </div>
            <div class="theme-card" data-mode="system">
              <div class="theme-preview-box system"></div>
              <span style="font-weight:600;font-size:14px;color:var(--navy-900);">System Default</span>
            </div>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label" style="display:block;margin-bottom:12px;">Primary Color</label>
          <div class="color-options" id="colorPicker">
            <div class="color-circle active" style="background:#2563eb;" data-color="#2563eb"></div>
            <div class="color-circle" style="background:#16a34a;" data-color="#16a34a"></div>
            <div class="color-circle" style="background:#8b5cf6;" data-color="#8b5cf6"></div>
            <div class="color-circle" style="background:#db2777;" data-color="#db2777"></div>
            <div class="color-circle" style="background:#ea580c;" data-color="#ea580c"></div>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label" style="display:block;margin-bottom:12px;">Font Size</label>
          <div class="d-flex align-items-center gap-3">
            <span style="font-size:12px;color:var(--text-muted);">A</span>
            <input type="range" class="form-range" min="1" max="3" step="1" id="fontSizeRange" value="2" style="max-width:200px;">
            <span style="font-size:18px;color:var(--text-muted);">A</span>
          </div>
        </div>

        <div class="d-flex gap-3 mt-5">
          <button type="button" class="btn btn-ghost" style="width:120px; justify-content:center;" id="btnReset">Reset</button>
          <button type="button" class="btn btn-primary" style="width:160px; justify-content:center;" id="btnSave">Save Changes</button>
        </div>
      </div>

    </main>

    <footer class="dashboard-footer">
      <p>&copy; 2026 SIMS - Smart Student Internship Management System. All rights reserved.</p>
      <div class="login-footer-links"><a href="#">Privacy Policy</a><span>|</span><a href="#">Terms &amp; Conditions</a><span>|</span><a href="#">Support</a></div>
    </footer>
  </div>
</div>

<!-- Logout Modal -->
<div class="modal fade" id="logoutModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width:400px;">
    <div class="modal-content" style="border-radius:12px; border:none; padding:16px;">
      <div class="modal-body text-center pb-0">
        <div style="background:#fee2e2; color:#ef4444; width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 16px;"><i class="fa-solid fa-right-from-bracket"></i></div>
        <h4 class="mb-3" style="color:var(--navy-900); font-weight:600;">Logout Confirmation</h4>
        <p style="color:var(--text-muted); font-size:14px; margin-bottom:24px;">Are you sure you want to logout?</p>
      </div>
      <div class="modal-footer border-0 pt-0" style="display:flex; gap:12px; flex-wrap:nowrap;">
        <button type="button" class="btn btn-ghost w-50 justify-content-center m-0" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary w-50 justify-content-center m-0" style="background:#ef4444; border-color:#ef4444;" onclick="window.location.href='index.html'">Yes Logout</button>
      </div>
    </div>
  </div>
</div>

<div class="login-toast" id="dashToast"><i class="fa-solid fa-circle-check"></i><span id="dashToastMsg">Done!</span></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/global-store.js"></script>
<script src="../js/student-layout.js"></script>
<script src="../js/dashboard.js"></script>
<script src="../js/theme-settings.js"></script>
</body>
</html>
