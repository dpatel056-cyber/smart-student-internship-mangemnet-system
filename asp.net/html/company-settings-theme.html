<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme & Appearance - SIMS | Smart Student Internship Management System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/company-module.css">
<style>
  .theme-option { border: 2px solid transparent; border-radius: 12px; padding: 16px; cursor: pointer; transition: all .2s; background: #fff; text-align: center; }
  .theme-option:hover { background: #f8fafc; }
  .theme-option.active { border-color: var(--primary); background: #eff6ff; }
  .theme-preview-box { height: 100px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border-light); }
  
  .color-swatch { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .2s; }
  .color-swatch:hover { transform: scale(1.1); }
  .color-swatch.active { border-color: var(--text-dark); box-shadow: 0 0 0 2px #fff inset; }
</style>
</head>
<body class="dashboard-body">

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="dashboard-shell">
  <aside class="dashboard-sidebar" id="dashboardSidebar"></aside>

  <div class="dashboard-main-col">
    <header class="dashboard-topbar">
      <div class="dashboard-topbar-left">
        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Toggle menu"><i class="fa-solid fa-bars"></i></button>
        <div class="dashboard-page-title">Theme & Appearance<span>Customize your visual experience</span></div>
      </div>
      <div class="dashboard-topbar-right">
        <button class="icon-btn dash-icon-btn" id="dashNotifBtn" aria-label="Notifications"><i class="fa-regular fa-bell"></i><span class="badge">2</span></button>
        <div class="dash-profile-trigger" id="dashProfileTrigger">
          <span class="dash-avatar-sm" id="dashAvatarSm" style="background:linear-gradient(135deg,#2563eb,#7c3aed);">TN</span>
          <span class="dash-name" id="dashNameTop">TechNova Pvt Ltd<span>Company</span></span>
          <i class="fa-solid fa-chevron-down" style="font-size:11px;color:#94a3b8;"></i>
        </div>
      </div>
    </header>

    <main class="dashboard-content">
      <div class="pm-breadcrumb" id="breadcrumbNav"></div>

      <div class="co-page-header">
        <div class="co-page-header-left">
          <h1>Theme & Appearance</h1>
          <p>Personalize the dashboard colors and layouts</p>
        </div>
      </div>

      <div class="co-grid-2">
        
        <div>
          <div class="co-panel" style="margin-bottom:20px;">
            <h3 style="font-size:16px;font-weight:700;color:var(--text-dark);margin-bottom:16px;">Color Theme</h3>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;">
              
              <div class="theme-option active" onclick="setTheme(this)">
                <div class="theme-preview-box" style="background:#f8fafc;display:flex;">
                  <div style="width:30%;height:100%;background:#1e293b;border-radius:8px 0 0 8px;"></div>
                  <div style="flex:1;background:#fff;border-radius:0 8px 8px 0;border-left:1px solid #e2e8f0;padding:8px;">
                    <div style="width:100%;height:10px;background:#e2e8f0;border-radius:4px;margin-bottom:6px;"></div>
                    <div style="width:60%;height:10px;background:#e2e8f0;border-radius:4px;"></div>
                  </div>
                </div>
                <div style="font-size:13.5px;font-weight:500;color:var(--text-dark);"><i class="fa-regular fa-sun" style="margin-right:4px;"></i> Light Mode</div>
              </div>

              <div class="theme-option" onclick="setTheme(this)">
                <div class="theme-preview-box" style="background:#0f172a;display:flex;border-color:#1e293b;">
                  <div style="width:30%;height:100%;background:#020617;border-radius:8px 0 0 8px;"></div>
                  <div style="flex:1;background:#1e293b;border-radius:0 8px 8px 0;border-left:1px solid #334155;padding:8px;">
                    <div style="width:100%;height:10px;background:#334155;border-radius:4px;margin-bottom:6px;"></div>
                    <div style="width:60%;height:10px;background:#334155;border-radius:4px;"></div>
                  </div>
                </div>
                <div style="font-size:13.5px;font-weight:500;color:var(--text-dark);"><i class="fa-regular fa-moon" style="margin-right:4px;"></i> Dark Mode</div>
              </div>

              <div class="theme-option" onclick="setTheme(this)">
                <div class="theme-preview-box" style="background:linear-gradient(135deg,#f8fafc 50%,#0f172a 50%);"></div>
                <div style="font-size:13.5px;font-weight:500;color:var(--text-dark);"><i class="fa-solid fa-desktop" style="margin-right:4px;"></i> System Default</div>
              </div>

            </div>
          </div>

          <div class="co-panel">
            <h3 style="font-size:16px;font-weight:700;color:var(--text-dark);margin-bottom:16px;">Primary Color</h3>
            <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">Select the main accent color for buttons and active states.</p>
            <div style="display:flex;gap:12px;">
              <div class="color-swatch active" style="background:#2563eb;" onclick="setColor(this)"></div>
              <div class="color-swatch" style="background:#0d9488;" onclick="setColor(this)"></div>
              <div class="color-swatch" style="background:#ea580c;" onclick="setColor(this)"></div>
              <div class="color-swatch" style="background:#db2777;" onclick="setColor(this)"></div>
              <div class="color-swatch" style="background:#7c3aed;" onclick="setColor(this)"></div>
            </div>
            
            <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border-light);">
              <button class="btn btn-primary" onclick="statusToast('Appearance settings saved!', 'success')">Save Changes</button>
            </div>
          </div>
        </div>

        <div>
          <div class="co-panel">
            <h3 style="font-size:16px;font-weight:700;color:var(--text-dark);margin-bottom:16px;">Layout Preference</h3>
            <div class="co-form-group">
              <label>Sidebar Style</label>
              <select style="width:100%;padding:12px;border:1px solid var(--border-light);border-radius:8px;font-family:inherit;font-size:13.5px;outline:none;">
                <option>Expanded (Default)</option>
                <option>Collapsed (Icons only)</option>
              </select>
            </div>
            <div class="co-form-group" style="margin-top:16px;">
              <label>Content Width</label>
              <select style="width:100%;padding:12px;border:1px solid var(--border-light);border-radius:8px;font-family:inherit;font-size:13.5px;outline:none;">
                <option>Full Width (Fluid)</option>
                <option>Contained (Centered)</option>
              </select>
            </div>
          </div>
        </div>

      </div>

    </main>
  </div>
</div>

<script src="../js/global-store.js"></script>
<script src="../js/company-dashboard.js"></script>
<script>
  function setTheme(el) {
    document.querySelectorAll('.theme-option').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
  }
  function setColor(el) {
    document.querySelectorAll('.color-swatch').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  }
  function statusToast(msg, type='success') {
    if(window.simsShowToast) window.simsShowToast(msg, type);
  }
</script>
</body>
</html>
